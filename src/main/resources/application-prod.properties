# Production memory optimization profile
server.tomcat.max-threads=8
server.tomcat.min-spare-threads=2
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20000

# Aggressive database connection pooling
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=30000

# Hibernate optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Memory management
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.dbcp.initialSize=1
spring.jpa.properties.hibernate.dbcp.maxTotal=3

# Disable unused features
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Minimal logging
logging.level.root=ERROR
logging.level.fi.haagahelia=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.security=ERROR

# JVM optimizations (for Railway deployment)
java.runtime.version=17
server.servlet.session.timeout=15m
server.servlet.context-parameters=trace=false
spring.mvc.log-request-details=false
